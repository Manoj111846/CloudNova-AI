<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1a"><title>Log in · CloudNova AI</title><link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/css/styles.css"></head><body class="auth-page"><main class="auth-shell"><a class="auth-brand" href="/"><img src="/assets/images/cloudnova-logo.svg" alt=""><span><b>CloudNova <i>AI</i></b><small>PERSONAL AI OS</small></span></a><div class="auth-kicker">WELCOME BACK</div><h1>Sign in to your space.</h1><p class="auth-subtitle">Pick up where your ideas left off. Your personal AI workspace is waiting.</p><div class="auth-feedback" id="feedback">Enter your account details to continue.</div><form class="auth-form" id="authForm"><label>Email address<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label><label>Password<input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required minlength="1"></label><button class="auth-submit" type="submit">Log in <span>→</span></button></form><p class="auth-note">🔒 Passwords are stored as secure hashes, not plain text.</p><div class="auth-switch">New to CloudNova AI? <a href="/signup">Create an account</a></div><a class="auth-back" href="/">← Back to workspace</a></main><script>
const form=document.querySelector('#authForm'),feedback=document.querySelector('#feedback'),button=form.querySelector('button');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.firstChild.textContent='Signing in…';
try{const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.detail||'Could not log in.');location.href='/';}
catch(err){feedback.textContent=err.message;feedback.classList.add('show');}finally{button.disabled=false;button.firstChild.textContent='Log in ';}});
</script></body></html>
